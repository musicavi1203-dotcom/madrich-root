name: Unzip and build

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'שם קובץ ה-zip בשורש הריפו'
        required: true
        default: 'madrich-root.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract zip and remove it
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          unzip -o "$ZIP_PATH" -d .
          rm -f "$ZIP_PATH"

      - name: Commit extracted files (without workflow files)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows'
          git commit -m "Extract project from zip" || echo "no changes to commit"
          git push

  build:
    needs: unzip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: madrich-root-apk
          path: app/build/outputs/apk/debug/*.apk
